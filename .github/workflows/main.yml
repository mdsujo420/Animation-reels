name: make-reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty = use trending)"
        required: false
        default: ""
      chat_id:
        description: "Telegram chat id"
        required: false
        default: ""
  schedule:
    - cron: "0 0,5,10,15,20 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - name: Make reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
        run: python -m src
